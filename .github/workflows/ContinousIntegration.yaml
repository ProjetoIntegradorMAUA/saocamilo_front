name: Continous Integration

on: 
    pull_request: 
        branches: 
            main

jobs:
    continous-integration:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3
            - name: Installing Node.js
              uses: actions/setup-node@v2
              with:
                node-version: 24.x
            - name: Installing dependencies
              run: |
                npm install
                npm run build