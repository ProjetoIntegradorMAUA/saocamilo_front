<svg width="600" height="580" viewBox="0 0 600 580" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Logo São Camilo Brasil</title>
  <desc>Ícone espiral com texto São Camilo Brasil abaixo</desc>

  <style>
    .nome { font-family: sans-serif; font-size: 90px; font-weight: 300; letter-spacing: 6px; fill: #888888; }
    .sub  { font-family: sans-serif; font-size: 38px; font-weight: 300; letter-spacing: 10px; fill: #888888; }
    .bold { font-weight: 600; fill: #555555; }
  </style>

  <g transform="translate(300,170) scale(0.75)">
    <path fill="#C0001A" d="M30,-35 C50,-55 70,-90 65,-145 C58,-190 30,-220 0,-218 C-30,-216 -55,-188 -42,-158 C-30,-128 5,-118 20,-88 C30,-65 28,-50 30,-35 Z"/>
    <path fill="#CC0018" transform="rotate(60)"  d="M30,-35 C50,-55 70,-90 65,-145 C58,-190 30,-220 0,-218 C-30,-216 -55,-188 -42,-158 C-30,-128 5,-118 20,-88 C30,-65 28,-50 30,-35 Z"/>
    <path fill="#D4001E" transform="rotate(120)" d="M30,-35 C50,-55 70,-90 65,-145 C58,-190 30,-220 0,-218 C-30,-216 -55,-188 -42,-158 C-30,-128 5,-118 20,-88 C30,-65 28,-50 30,-35 Z"/>
    <path fill="#C0001A" transform="rotate(180)" d="M30,-35 C50,-55 70,-90 65,-145 C58,-190 30,-220 0,-218 C-30,-216 -55,-188 -42,-158 C-30,-128 5,-118 20,-88 C30,-65 28,-50 30,-35 Z"/>
    <path fill="#CC0018" transform="rotate(240)" d="M30,-35 C50,-55 70,-90 65,-145 C58,-190 30,-220 0,-218 C-30,-216 -55,-188 -42,-158 C-30,-128 5,-118 20,-88 C30,-65 28,-50 30,-35 Z"/>
    <path fill="#D4001E" transform="rotate(300)" d="M30,-35 C50,-55 70,-90 65,-145 C58,-190 30,-220 0,-218 C-30,-216 -55,-188 -42,-158 C-30,-128 5,-118 20,-88 C30,-65 28,-50 30,-35 Z"/>
  </g>

  <text x="300" y="430" class="nome" text-anchor="middle"><tspan class="bold">SĀO</tspan>CAMILO</text>
  <text x="300" y="490" class="sub" text-anchor="middle">BRASIL</text>

</svg>
